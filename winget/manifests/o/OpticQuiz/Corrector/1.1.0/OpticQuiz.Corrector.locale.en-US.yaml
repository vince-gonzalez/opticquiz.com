ShortDescription: Color-blindness correction for the entire Windows screen.
Description: |-
  OpticQuiz Corrector re-colors your whole display so colors that collapse together for
  color-vision deficiency become distinguishable. It applies to everything on screen -
  games, PDFs, video, and other applications - not only web pages, and runs from the
  system tray.

  Three correction modes (deuteranopia, protanopia, tritanopia) plus a balanced mode for
  people who do not know their type. The transform is a published, open-access method
  (Machado 2009 simulation with CIEDE2000, DOI 10.5281/zenodo.21310578).

  The matrices used here are derived specifically for the color space Windows applies
  them in, which differs from the browser. Reusing the browser matrices measured worse,
  so this ships its own.

  This is an accessibility aid, not a cure or a medical device. It makes colors easier
  to tell apart; it does not restore color vision.
